name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Setup Capacitor & Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps
          npx cap init "MoTA Scholarship" "gov.in.mota.scholarship" --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoTA-Scholarship-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
